name: Top Languages

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate Top Languages
        env:
          GH_TOKEN: ${{ secrets.METRICS_TOKEN }}
        run: |
          python3 <<'PY'
          import os
          import json
          import urllib.request
          from collections import Counter

          TOKEN = os.environ["GH_TOKEN"]
          USERNAME = "Dionclei-Pereira"

          headers = {
              "Authorization": f"Bearer {TOKEN}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          def github(url):
              req = urllib.request.Request(url, headers=headers)

              with urllib.request.urlopen(req) as response:
                  return json.load(response)

          # ============================================================
          # Busca TODOS os repositórios públicos + privados
          # ============================================================

          repos = []
          page = 1

          while True:
              url = (
                  f"https://api.github.com/user/repos"
                  f"?per_page=100&page={page}&affiliation=owner,collaborator,organization_member"
              )

              data = github(url)

              if not data:
                  break

              repos.extend(data)
              page += 1

          print(f"Repositórios encontrados: {len(repos)}")

          # ============================================================
          # Linguagens que queremos ignorar
          # ============================================================

          ignored = {
              "HTML",
              "CSS",
              "SCSS",
              "Dockerfile",
              "Blade",
          }

          languages = Counter()

          # ============================================================
          # Soma bytes de cada linguagem
          # ============================================================

          for repo in repos:
              name = repo["full_name"]

              print(f"Analisando: {name}")

              try:
                  data = github(
                      f"https://api.github.com/repos/{name}/languages"
                  )

                  for language, bytes_count in data.items():
                      if language not in ignored:
                          languages[language] += bytes_count

              except Exception as e:
                  print(f"Erro em {name}: {e}")

          # ============================================================
          # Pega as 8 linguagens principais
          # ============================================================

          languages = languages.most_common(8)

          total = sum(value for _, value in languages)

          if total == 0:
              raise RuntimeError("Nenhuma linguagem encontrada.")

          results = []

          for language, value in languages:
              percentage = value / total * 100

              results.append({
                  "name": language,
                  "percentage": percentage
              })

          print()
          print("Resultado:")

          for item in results:
              print(
                  f'{item["name"]}: {item["percentage"]:.1f}%'
              )

          # ============================================================
          # Cores Night Owl
          # ============================================================

          colors = {
              "PHP": "#777BB4",
              "JavaScript": "#F7DF1E",
              "TypeScript": "#3178C6",
              "Python": "#3776AB",
              "Java": "#ED8B00",
              "C": "#A8B9CC",
              "C++": "#00599C",
              "C#": "#512BD4",
              "Go": "#00ADD8",
              "Rust": "#DEA584",
              "Ruby": "#CC342D",
              "Kotlin": "#A97BFF",
              "Swift": "#F05138",
              "Dart": "#0175C2",
              "SQL": "#CCCCCC",
          }

          default_colors = [
              "#82AAFF",
              "#C792EA",
              "#7FDBCA",
              "#F78C6C",
              "#FFCB6B",
              "#89DDFF",
              "#ADD7FF",
              "#A6ACCD",
          ]

          # ============================================================
          # SVG
          # ============================================================

          width = 500
          height = 220

          svg = f'''<svg
              xmlns="http://www.w3.org/2000/svg"
              width="{width}"
              height="{height}"
              viewBox="0 0 {width} {height}"
          >

            <defs>
              <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0%" stop-color="#011627"/>
                <stop offset="100%" stop-color="#020E1A"/>
              </linearGradient>
            </defs>

            <rect
              width="100%"
              height="100%"
              rx="12"
              fill="url(#bg)"
            />

            <text
              x="28"
              y="36"
              fill="#D6DEEB"
              font-family="Arial, Helvetica, sans-serif"
              font-size="18"
              font-weight="600"
            >
              Top Languages
            </text>
          '''

          y = 65

          for index, item in enumerate(results):
              name = item["name"]
              percentage = item["percentage"]

              color = colors.get(
                  name,
                  default_colors[index % len(default_colors)]
              )

              # largura máxima da barra
              bar_width = 280

              # escala baseada na maior linguagem
              max_percentage = results[0]["percentage"]

              current_width = (
                  percentage / max_percentage
              ) * bar_width

              svg += f'''
                <text
                  x="28"
                  y="{y}"
                  fill="#D6DEEB"
                  font-family="Arial, Helvetica, sans-serif"
                  font-size="12"
                >
                  {name}
                </text>

                <rect
                  x="120"
                  y="{y - 10}"
                  width="{bar_width}"
                  height="8"
                  rx="4"
                  fill="#1B2B3A"
                />

                <rect
                  x="120"
                  y="{y - 10}"
                  width="{current_width:.2f}"
                  height="8"
                  rx="4"
                  fill="{color}"
                />

                <text
                  x="420"
                  y="{y}"
                  fill="#A6ACCD"
                  font-family="Arial, Helvetica, sans-serif"
                  font-size="12"
                  text-anchor="end"
                >
                  {percentage:.1f}%
                </text>
              '''

              y += 20

          svg += "</svg>"

          with open("top-langs.svg", "w", encoding="utf-8") as file:
              file.write(svg)

          print("top-langs.svg gerado com sucesso!")
          PY

      - name: Commit SVG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add top-langs.svg

          git diff --cached --quiet || git commit -m "chore: update top languages"

          git push
