name: Top Languages

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate Top Languages
        env:
          GH_TOKEN: ${{ secrets.METRICS_TOKEN }}
        run: |
          python3 <<'PY'
          import os
          import json
          import urllib.request
          from collections import Counter

          TOKEN = os.environ["GH_TOKEN"]
          USERNAME = "Dionclei-Pereira"

          headers = {
              "Authorization": f"Bearer {TOKEN}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          def github(url):
              req = urllib.request.Request(url, headers=headers)

              with urllib.request.urlopen(req) as response:
                  return json.load(response)

          # ============================================================
          # Busca TODOS os repositórios públicos + privados
          # ============================================================

          repos = []
          page = 1

          while True:
              url = (
                  f"https://api.github.com/user/repos"
                  f"?per_page=100&page={page}&affiliation=owner,collaborator,organization_member"
              )

              data = github(url)

              if not data:
                  break

              repos.extend(data)
              page += 1

          print(f"Repositórios encontrados: {len(repos)}")

          ignored = {
              "HTML",
              "CSS",
              "SCSS",
              "Dockerfile",
              "Blade",
          }

          languages = Counter()

          for repo in repos:
              name = repo["full_name"]

              print(f"Analisando: {name}")

              try:
                  data = github(
                      f"https://api.github.com/repos/{name}/languages"
                  )

                  for language, bytes_count in data.items():
                      if language not in ignored:
                          languages[language] += bytes_count

              except Exception as e:
                  print(f"Erro em {name}: {e}")


          languages = languages.most_common(6)

          total = sum(value for _, value in languages)

          if total == 0:
              raise RuntimeError("Nenhuma linguagem encontrada.")

          results = []

          for language, value in languages:
              percentage = value / total * 100

              results.append({
                  "name": language,
                  "percentage": percentage
              })

          print()
          print("Resultado:")

          for item in results:
              print(
                  f'{item["name"]}: {item["percentage"]:.1f}%'
              )

          import html

          width = 500
          height = 190

          # Paleta Night Owl
          colors = {
              "PHP": "#777BB4",
              "JavaScript": "#F7DF1E",
              "TypeScript": "#3178C6",
              "Python": "#3776AB",
              "Java": "#ED8B00",
              "C": "#A8B9CC",
              "C++": "#00599C",
              "C#": "#512BD4",
              "Go": "#00ADD8",
              "Rust": "#DEA584",
              "Ruby": "#CC342D",
              "Kotlin": "#A97BFF",
              "Swift": "#F05138",
              "Dart": "#0175C2",
              "SQL": "#CCCCCC",
          }

          default_colors = [
              "#82AAFF",
              "#C792EA",
              "#7FDBCA",
              "#F78C6C",
              "#FFCB6B",
              "#89DDFF",
              "#ADD7FF",
              "#A6ACCD",
          ]

          svg = f'''<svg
              xmlns="http://www.w3.org/2000/svg"
              width="{width}"
              height="{height}"
              viewBox="0 0 {width} {height}"
          >

            <!-- Fundo -->
            <rect
              x="0.5"
              y="0.5"
              width="{width - 1}"
              height="{height - 1}"
              rx="5"
              fill="#011627"
              stroke="#A6ACCD"
              stroke-width="1"
            />

            <!-- Título -->
            <text
              x="24"
              y="37"
              fill="#C792EA"
              font-family="Arial, Helvetica, sans-serif"
              font-size="16"
              font-weight="600"
            >
              Most Used Languages
            </text>
          '''

          bar_x = 24
          bar_y = 54
          bar_width = 450
          bar_height = 9

          # Fundo da barra
          svg += f'''
            <rect
              x="{bar_x}"
              y="{bar_y}"
              width="{bar_width}"
              height="{bar_height}"
              rx="4"
              fill="#1B2B3A"
            />
          '''

          # Segmentos da barra
          current_x = bar_x

          for index, (language, value) in enumerate(languages):

              percentage = value / total * 100

              color = colors.get(
                  language,
                  default_colors[index % len(default_colors)]
              )

              segment_width = (
                  percentage / 100
              ) * bar_width

              svg += f'''
                <rect
                  x="{current_x:.2f}"
                  y="{bar_y}"
                  width="{segment_width:.2f}"
                  height="{bar_height}"
                  fill="{color}"
                />
              '''

              current_x += segment_width

          legend_y_start = 92
          row_height = 27

          # Divide em duas colunas
          columns = 2

          for index, (language, value) in enumerate(languages):

              percentage = value / total * 100

              color = colors.get(
                  language,
                  default_colors[index % len(default_colors)]
              )

              column = index % columns
              row = index // columns

              if column == 0:
                  x = 24
              else:
                  x = 180

              y = legend_y_start + (row * row_height)

              # Bolinha
              svg += f'''
                <circle
                  cx="{x + 5}"
                  cy="{y - 4}"
                  r="5"
                  fill="{color}"
                />
              '''

              # Nome + porcentagem
              safe_language = html.escape(language)

              svg += f'''
                <text
                  x="{x + 16}"
                  y="{y}"
                  fill="#82AAFF"
                  font-family="Arial, Helvetica, sans-serif"
                  font-size="11"
                >
                  {safe_language}
                </text>

                <text
                  x="{x + 16 + len(language) * 6.2}"
                  y="{y}"
                  fill="#7FDBCA"
                  font-family="Arial, Helvetica, sans-serif"
                  font-size="11"
                >
                  {percentage:.2f}%
                </text>
              '''

          svg += "</svg>"

          with open("top-langs.svg", "w", encoding="utf-8") as file:
              file.write(svg)

          print("top-langs.svg gerado com sucesso!")
          PY

      - name: Commit SVG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add top-langs.svg

          git diff --cached --quiet || git commit -m "chore: update top languages"

          git push
