name: Top Languages

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate Top Languages
        env:
          GH_TOKEN: ${{ secrets.METRICS_TOKEN }}
        run: |
          python3 <<'PY'
          import os
          import json
          import html
          import urllib.request
          from collections import Counter
          
          TOKEN = os.environ["GH_TOKEN"]
          USERNAME = "Dionclei-Pereira"
          
          headers = {
            "Authorization": f"Bearer {TOKEN}",
            "Accept": "application/vnd.github+json",
            "X-GitHub-Api-Version": "2022-11-28",
          }
          
          def github(url):
            req = urllib.request.Request(
                url,
                headers=headers
            )
          
            with urllib.request.urlopen(req) as response:
                return json.load(response)
          
          repos = []
          page = 1
          
          while True:
          
            url = (
                f"https://api.github.com/user/repos"
                f"?per_page=100"
                f"&page={page}"
                f"&affiliation=owner,collaborator,organization_member"
            )
          
            data = github(url)
          
            if not data:
                break
          
            repos.extend(data)
          
            page += 1
          
          print(f"Repositórios encontrados: {len(repos)}")
          
          ignored = {
            "HTML",
            "CSS",
            "SCSS",
            "Dockerfile",
            "Blade",
          }
          
          languages = Counter()
          
          for repo in repos:
          
            name = repo["full_name"]
          
            print(f"Analisando: {name}")
          
            try:
          
                data = github(
                    f"https://api.github.com/repos/{name}/languages"
                )
          
                for language, bytes_count in data.items():
          
                    if language not in ignored:
                        languages[language] += bytes_count
          
            except Exception as e:
          
                print(
                    f"Erro em {name}: {e}"
                )
          
          languages = languages.most_common(6)
          
          total = sum(
            value for _, value in languages
          )
          
          if total == 0:
            raise RuntimeError(
                "Nenhuma linguagem encontrada."
            )
          
          results = []
          
          for language, value in languages:
          
            percentage = (
                value / total
            ) * 100
          
            results.append({
                "name": language,
                "percentage": percentage
            })
          
          print()
          print("Resultado:")
          
          for item in results:
          
            print(
                f'{item["name"]}: '
                f'{item["percentage"]:.2f}%'
            )
          
          colors = {
          
            "PHP": "#777BB4",
          
            "JavaScript": "#F7DF1E",
          
            "TypeScript": "#3178C6",
          
            "Python": "#3776AB",
          
            "Java": "#ED8B00",
          
            "C": "#A8B9CC",
          
            "C++": "#00599C",
          
            "C#": "#512BD4",
          
            "Go": "#00ADD8",
          
            "Rust": "#DEA584",
          
            "Ruby": "#CC342D",
          
            "Kotlin": "#A97BFF",
          
            "Swift": "#F05138",
          
            "Dart": "#0175C2",
          
            "SQL": "#CCCCCC",
          }
          
          default_colors = [
          
            "#82AAFF",
          
            "#C792EA",
          
            "#7FDBCA",
          
            "#F78C6C",
          
            "#FFCB6B",
          
            "#89DDFF",
          
            "#ADD7FF",
          
            "#A6ACCD",
          
          ]
          
          width = 350
          height = 180
          
          BASE_WIDTH = 300
          BASE_HEIGHT = 180
          
          scale_x = width / BASE_WIDTH
          scale_y = height / BASE_HEIGHT
          
          scale = min(scale_x, scale_y)
          
          margin_x = 24 * scale_x
          
          title_x = margin_x
          title_y = 37 * scale_y
          title_size = 16 * scale
          
          bar_x = margin_x
          bar_y = 54 * scale_y
          
          bar_width = width - (margin_x * 2)
          bar_height = 9 * scale_y
          
          bar_radius = bar_height / 2
          
          legend_y_start = 94 * scale_y
          row_height = 31 * scale_y
          
          left_x = margin_x
          right_x = width * 0.52
          
          left_percent_x = width * 0.46
          right_percent_x = width - margin_x
          
          dot_radius = 5 * scale
          
          language_offset_x = 18 * scale_x
          
          legend_font_size = 11 * scale
          
          svg = f'''<svg
            xmlns="http://www.w3.org/2000/svg"
            width="{width}"
            height="{height}"
            viewBox="0 0 {width} {height}"
          >
          
          <rect
            x="{0.5 * scale:.2f}"
            y="{0.5 * scale:.2f}"
            width="{width - (1 * scale):.2f}"
            height="{height - (1 * scale):.2f}"
            rx="{6 * scale:.2f}"
            fill="#011627"
            stroke="#A6ACCD"
            stroke-width="{1 * scale:.2f}"
          />
          
          <text
            x="{title_x:.2f}"
            y="{title_y:.2f}"
            fill="#C792EA"
            font-family="Arial, Helvetica, sans-serif"
            font-size="{title_size:.2f}"
            font-weight="600"
          >
            Most Used Languages
          </text>
          '''
          
          svg += f'''
          <rect
            x="{bar_x:.2f}"
            y="{bar_y:.2f}"
            width="{bar_width:.2f}"
            height="{bar_height:.2f}"
            rx="{bar_radius:.2f}"
            fill="#1B2B3A"
          />
          '''
          
          current_x = bar_x
          
          for index, (language, value) in enumerate(languages):
          
              percentage = (
                  value / total
              ) * 100
          
              color = colors.get(
                  language,
                  default_colors[
                      index % len(default_colors)
                  ]
              )
          
              segment_width = (
                  percentage / 100
              ) * bar_width
          
              svg += f'''
          <rect
            x="{current_x:.2f}"
            y="{bar_y:.2f}"
            width="{segment_width:.2f}"
            height="{bar_height:.2f}"
            fill="{color}"
          />
          '''
          
              current_x += segment_width
          
          def draw_legend_item(
              language,
              value,
              x,
              percent_x,
              y,
              index
          ):
          
              percentage = (
                  value / total
              ) * 100
          
              color = colors.get(
                  language,
                  default_colors[
                      index % len(default_colors)
                  ]
              )
          
              safe_language = html.escape(
                  language
              )
          
              return f'''
          
          <circle
            cx="{x + (5 * scale_x):.2f}"
            cy="{y - (4 * scale_y):.2f}"
            r="{dot_radius:.2f}"
            fill="{color}"
          />
          
          <text
            x="{x + language_offset_x:.2f}"
            y="{y:.2f}"
            fill="#82AAFF"
            font-family="Arial, Helvetica, sans-serif"
            font-size="{legend_font_size:.2f}"
          >
            {safe_language}
          </text>
          
          <text
            x="{percent_x:.2f}"
            y="{y:.2f}"
            fill="#7FDBCA"
            font-family="Arial, Helvetica, sans-serif"
            font-size="{legend_font_size:.2f}"
            text-anchor="end"
          >
            {percentage:.2f}%
          </text>
          '''
          
          for row in range(3):
          
              y = (
                  legend_y_start
                  + (row * row_height)
              )
          
              left_index = row
          
              language_left, value_left = (
                  languages[left_index]
              )
          
              svg += draw_legend_item(
                  language_left,
                  value_left,
                  left_x,
                  left_percent_x,
                  y,
                  left_index
              )
          
              right_index = row + 3
          
              language_right, value_right = (
                  languages[right_index]
              )
          
              svg += draw_legend_item(
                  language_right,
                  value_right,
                  right_x,
                  right_percent_x,
                  y,
                  right_index
              )
          
          svg += '''
          </svg>
          '''
          
          with open(
              "top-langs.svg",
              "w",
              encoding="utf-8"
          ) as file:
          
              file.write(svg)
          
          print("top-langs.svg gerado com sucesso!")
          PY

      - name: Commit SVG
        run: |

          git config user.name "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add top-langs.svg

          git diff --cached --quiet || \
            git commit \
              -m "chore: update top languages"

          git push
